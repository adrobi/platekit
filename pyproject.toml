[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platekit"
version = "1.0.0"
description = "Open-source desktop tool for 96/384-well PCR & sequencing plate planning, Master Mix calculation, DNA normalization and instrument export"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
platekit = "plate_cli:main"

[tool.setuptools]
packages = ["plate_core", "ui"]
py-modules = ["plate_cli", "i18n", "translations_en"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
